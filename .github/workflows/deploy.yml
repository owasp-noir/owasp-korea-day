---
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds with hwaro and pushes the result to the gh-pages branch.
      # Pages itself is switched on once in the repository settings
      # (Settings > Pages > Deploy from a branch > gh-pages).
      - uses: hahwul/hwaro@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
