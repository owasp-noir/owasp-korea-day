<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <title>{% if page.title is present and page.title != site.title %}{{ page.title | e }} - {% endif %}{{ site.title | e }}</title>
  <meta name="theme-color" content="#000000">
  {{ og_all_tags | safe }}
  {{ canonical_tag | safe }}

  <link rel="icon" href="{{ base_url }}/logos/favicon.ico" sizes="any">
  <link rel="icon" href="{{ base_url }}/logos/favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="{{ base_url }}/logos/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  {{ highlight_tags | safe }}
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="wrap site-header__in">
      <a class="brand" href="{{ base_url }}/">
        <img src="{{ base_url }}/images/logo-s.png" alt="" width="28" height="28">
        <span>Noir 기여 핸즈온</span>
      </a>
      <nav class="site-nav" aria-label="기여 방법">
        <a href="{{ base_url }}/web/"{% if page.url == "/web/" %} aria-current="page"{% endif %}>브라우저로 기여</a>
        <a href="{{ base_url }}/report/"{% if page.url == "/report/" %} aria-current="page"{% endif %}>써 보고 제보</a>
        <a href="{{ base_url }}/code/"{% if page.url == "/code/" %} aria-current="page"{% endif %}>코드로 기여</a>
        <a class="site-nav__out" href="https://github.com/owasp-noir/noir/issues?q=is%3Aissue+is%3Aopen+label%3Aowasp-korea-day">과제 목록</a>
      </nav>
    </div>
  </header>
