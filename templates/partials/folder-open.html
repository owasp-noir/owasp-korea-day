{# The folder: its index tabs are the navigation between cases. The current
   tab is the same colour as the folder body, so it reads as the open one. #}
<div class="wrap folder">
  <nav class="tabs" aria-label="사건 파일">
    <a class="tab" href="{{ base_url }}/web/"{% if page.url == "/web/" %} aria-current="page"{% endif %}><span class="tab__long">브라우저로 기여</span><span class="tab__short">브라우저</span></a>
    <a class="tab" href="{{ base_url }}/report/"{% if page.url == "/report/" %} aria-current="page"{% endif %}><span class="tab__long">써 보고 제보</span><span class="tab__short">제보</span></a>
    <a class="tab" href="{{ base_url }}/code/"{% if page.url == "/code/" %} aria-current="page"{% endif %}><span class="tab__long">코드로 기여</span><span class="tab__short">코드</span></a>
    <a class="tab" href="{{ base_url }}/security/"{% if page.url == "/security/" %} aria-current="page"{% endif %}><span class="tab__long">취약점 제보</span><span class="tab__short">취약점</span></a>
  </nav>
  <div class="folder__body">
    <div class="sheet">
