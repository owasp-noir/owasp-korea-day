title = "Noir 기여 핸즈온"
description = "OWASP Korea Day 2026에서 OWASP Noir에 첫 기여를 남기는 두 시간. 브라우저만으로 PR을 올리는 방법부터 코드를 고치는 방법까지 안내해요."
base_url = "https://owasp-noir.github.io/owasp-korea-day"
default_language = "ko"

[content.files]
allow_extensions = ["jpg", "jpeg", "png", "gif", "svg", "webp"]

# hwaro marks up code at build time. The templates do not load a highlight.js
# theme: static/css/style.css colours every .hljs token itself, so `theme` is
# unused.
[highlight]
enabled = true
theme = "github-dark"

# The picture shown when the link is shared in a messenger. It is a screenshot
# of the cover in the site's own style (1200x630).
[og]
default_image = "/images/og.jpg"
type = "website"
twitter_card = "summary_large_image"

[sitemap]
enabled = true

[feeds]
enabled = false

[templates]
autoescape = true
